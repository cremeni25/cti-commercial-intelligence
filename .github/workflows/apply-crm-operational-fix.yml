name: Apply CRM operational fix

on:
  push:
    branches:
      - fix-crm-operational-source-and-lint

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-crm-operational-source-and-lint
      - name: Apply deterministic replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'backend/routers/crm_router.py': [
                  ('from fastapi import APIRouter, HTTPException', 'from fastapi import APIRouter, HTTPException'),
                  (
                      '@router.get("/oportunidades")\ndef listar_oportunidades():\n    return supabase.table("cti_oportunidades").select("*").order("created_at", desc=True).execute().data',
                      '@router.get("/oportunidades")\ndef listar_oportunidades(origem: Optional[str] = None):\n    consulta = supabase.table("cti_oportunidades").select("*")\n    if origem:\n        consulta = consulta.eq("origem", origem.strip().upper())\n    return consulta.order("created_at", desc=True).execute().data'
                  ),
              ],
              'frontend/src/app/oportunidades/page.tsx': [
                  ('fetch(`${API_URL}/crm/oportunidades`, { cache: "no-store" })', 'fetch(`${API_URL}/crm/oportunidades?origem=CRM_APP`, { cache: "no-store" })'),
                  ('String(form.get("origem") || "CRM")', 'String(form.get("origem") || "CRM_APP")'),
                  ('<Campo nome="origem" label="Origem" padrao="CRM" />', '<Campo nome="origem" label="Origem" padrao="CRM_APP" />'),
              ],
              'frontend/src/app/atividades/page.tsx': [
                  ('fetch(`${API_URL}/crm/oportunidades`)', 'fetch(`${API_URL}/crm/oportunidades?origem=CRM_APP`)'),
              ],
              'frontend/src/app/crm-app/[...modulo]/page.tsx': [
                  ('endpoint: "/crm/oportunidades",', 'endpoint: "/crm/oportunidades?origem=CRM_APP",'),
                  ('  useEffect(() => {\n    void carregar()\n  }, [carregar])', '  useEffect(() => {\n    queueMicrotask(() => void carregar())\n  }, [carregar])'),
              ],
              'frontend/src/app/crm-app/page.tsx': [
                  ('fetch("/api/crm-proxy/crm/oportunidades", { cache: "no-store" })', 'fetch("/api/crm-proxy/crm/oportunidades?origem=CRM_APP", { cache: "no-store" })'),
                  ('  useEffect(() => { void sincronizar() }, [sincronizar])', '  useEffect(() => { queueMicrotask(() => void sincronizar()) }, [sincronizar])'),
              ],
          }

          for filename, items in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in items:
                  if old == new:
                      continue
                  count = text.count(old)
                  if count == 0:
                      raise SystemExit(f'Expressão não encontrada em {filename}: {old[:90]}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/apply-crm-operational-fix.yml')
          workflow.unlink()
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: unificar origem operacional e eliminar lint do CRM"
          git push origin HEAD:fix-crm-operational-source-and-lint
