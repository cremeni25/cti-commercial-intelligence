name: IA Preview Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ia-preview-smoke.yml"
      - "backend/services/ia_comercial_agente.py"
      - "backend/routers/ia_comercial_cti_router.py"

permissions:
  contents: read

jobs:
  smoke-preview:
    if: github.event.pull_request.number == 206
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aguardar preview Render responder
        shell: bash
        run: |
          set -euo pipefail
          URL="https://cti-backend-pr-206.onrender.com"
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/openapi.json -w "%{http_code}" "$URL/openapi.json" || true)
            if [ "$code" = "200" ]; then
              break
            fi
            echo "tentativa=$i http=$code"
            sleep 5
          done
          test "${code:-}" = "200"
          grep -q '"/ia-comercial-cti/status"' /tmp/openapi.json
          grep -q '"/ia-comercial-cti/conversas"' /tmp/openapi.json

      - name: Confirmar proteção da rota autenticada
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/status.json -w "%{http_code}" "https://cti-backend-pr-206.onrender.com/ia-comercial-cti/status")
          test "$code" = "401" -o "$code" = "403"
          echo "rota autenticada protegida: HTTP $code"
