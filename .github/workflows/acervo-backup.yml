# Cópia de segurança semanal do acervo comercial (clientes, negócios, propostas,
# pedidos, atividades, vendas, histórico de responsáveis e planilhas), guardada
# no cofre privado do CTI. Domingos às 03:17 de Brasília (06:17 UTC).
# O backend autentica esta execução pelo token de identidade (OIDC) do GitHub.
name: Cópia semanal do acervo

on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CTI_BACKEND_URL: https://cti-backend-5ugf.onrender.com

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Gerar cópia do acervo
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=cti-acervo-backup" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors --max-time 60 "$CTI_BACKEND_URL/status" > /dev/null
          curl -fsS --retry 2 --retry-delay 30 --retry-all-errors --max-time 600 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "$CTI_BACKEND_URL/interno/acervo/backup"
