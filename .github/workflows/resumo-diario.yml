# Dispara o resumo diário do Agente de Inteligência no celular da equipe.
# Dias úteis às 07:40 de Brasília (10:40 UTC). Requer os secrets do repositório
# CTI_BACKEND_URL e CTI_CRON_TOKEN; sem eles, o job termina sem fazer nada.
name: Resumo diário no celular

on:
  schedule:
    - cron: "40 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Disparar resumo diário
        env:
          CTI_BACKEND_URL: ${{ secrets.CTI_BACKEND_URL }}
          CTI_CRON_TOKEN: ${{ secrets.CTI_CRON_TOKEN }}
        run: |
          if [ -z "$CTI_BACKEND_URL" ] || [ -z "$CTI_CRON_TOKEN" ]; then
            echo "Secrets CTI_BACKEND_URL/CTI_CRON_TOKEN não configurados; nada a fazer."
            exit 0
          fi
          # O backend pode estar hibernando: acorda e aguarda antes do disparo.
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors --max-time 60 "$CTI_BACKEND_URL/status" > /dev/null
          curl -fsS --retry 3 --retry-delay 15 --retry-all-errors --max-time 240 -X POST \
            -H "X-CTI-Cron-Token: $CTI_CRON_TOKEN" \
            "$CTI_BACKEND_URL/interno/notificacoes/resumo-diario"
