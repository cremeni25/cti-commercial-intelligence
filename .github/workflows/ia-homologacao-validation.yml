name: IA Homologacao Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/core/ia_agente_homologacao_config.py"
      - "backend/main_ia_homologacao.py"
      - "backend/migrations/homologacao/**"
      - "backend/routers/ia_comercial_agente_homologacao_router.py"
      - "backend/services/ia_comercial_agente_homologacao*.py"
      - "backend/services/ia_homologacao_memoria.py"
      - "backend/tests/test_ia_*homologacao*.py"
      - "backend/tests/test_ia_comercial_fontes.py"
      - "scripts/espelho/**"
      - "render.homologacao.yaml"
      - ".github/workflows/ia-homologacao-validation.yml"
  workflow_dispatch:

jobs:
  validate-ia-homologacao:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-key
      CTI_AMBIENTE: homologation
      CTI_IA_AGENTE_HOMOLOGACAO: "true"
      CTI_IA_AGENTE_SOMENTE_LEITURA: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest httpx
      - name: Validate isolated IA tests
        run: |
          pytest -q \
            tests/test_ia_agente_homologacao_config.py \
            tests/test_ia_agente_homologacao_read_only.py \
            tests/test_ia_homologacao_arquitetura.py \
            tests/test_ia_comercial_fontes.py
      - name: Validate Python compilation
        run: |
          python -m py_compile \
            core/ia_agente_homologacao_config.py \
            main_ia_homologacao.py \
            routers/ia_comercial_agente_homologacao_router.py \
            services/ia_comercial_agente_homologacao.py \
            services/ia_comercial_agente_homologacao_orquestrador.py \
            services/ia_homologacao_memoria.py
      - name: Validate shell scripts
        working-directory: .
        run: |
          bash -n scripts/espelho/exportar_estado_real.sh
          bash -n scripts/espelho/validar_fidelidade.sh
          bash -n scripts/espelho/implantar_espelho_completo.sh
