name: IA Homologacao Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/core/ia_agente_homologacao_config.py"
      - "backend/main_ia_homologacao.py"
      - "backend/migrations/homologacao/**"
      - "backend/routers/ia_comercial_agente_homologacao_router.py"
      - "backend/services/ia_comercial_agente_homologacao*.py"
      - "backend/services/ia_homologacao_memoria.py"
      - "backend/tests/test_ia_*homologacao*.py"
      - "backend/tests/test_ia_comercial_fontes.py"
      - "scripts/espelho/**"
      - "render.homologacao.yaml"
      - ".github/workflows/ia-homologacao-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ia-homologacao:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-key
      CTI_AMBIENTE: homologation
      CTI_IA_AGENTE_HOMOLOGACAO: "true"
      CTI_IA_AGENTE_SOMENTE_LEITURA: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest httpx
      - name: Validate isolated IA tests
        run: |
          pytest -q \
            tests/test_ia_agente_homologacao_config.py \
            tests/test_ia_agente_homologacao_read_only.py \
            tests/test_ia_homologacao_arquitetura.py \
            tests/test_ia_comercial_fontes.py
      - name: Validate Python compilation
        run: |
          python -m py_compile \
            core/ia_agente_homologacao_config.py \
            main_ia_homologacao.py \
            routers/ia_comercial_agente_homologacao_router.py \
            services/ia_comercial_agente_homologacao.py \
            services/ia_comercial_agente_homologacao_orquestrador.py \
            services/ia_homologacao_memoria.py
      - name: Validate shell scripts
        working-directory: .
        run: |
          bash -n scripts/espelho/exportar_estado_real.sh
          bash -n scripts/espelho/validar_fidelidade.sh
          bash -n scripts/espelho/implantar_espelho_completo.sh

  verify-database-connections:
    name: Verificar conexoes sem copiar dados
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cti-ia-homologação
    env:
      CTI_PRODUCAO_DATABASE_URL: ${{ secrets.CTI_PRODUCAO_DATABASE_URL }}
      CTI_HOMOLOGACAO_DATABASE_URL: ${{ secrets.CTI_HOMOLOGACAO_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Instalar cliente PostgreSQL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Validar formato e separacao dos destinos
        shell: bash
        run: |
          set -euo pipefail
          : "${CTI_PRODUCAO_DATABASE_URL:?Secret CTI_PRODUCAO_DATABASE_URL ausente.}"
          : "${CTI_HOMOLOGACAO_DATABASE_URL:?Secret CTI_HOMOLOGACAO_DATABASE_URL ausente.}"
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          origem = urlparse(os.environ["CTI_PRODUCAO_DATABASE_URL"])
          destino = urlparse(os.environ["CTI_HOMOLOGACAO_DATABASE_URL"])
          if origem.scheme not in {"postgres", "postgresql"}:
              raise SystemExit("BLOQUEADO: conexão de produção não é PostgreSQL.")
          if destino.scheme not in {"postgres", "postgresql"}:
              raise SystemExit("BLOQUEADO: conexão de homologação não é PostgreSQL.")
          if not origem.hostname or not destino.hostname:
              raise SystemExit("BLOQUEADO: hostname ausente.")
          if origem.hostname == destino.hostname:
              raise SystemExit("BLOQUEADO: origem e destino possuem o mesmo hostname.")
          if "fgljrlyxylhfaeeqijyoe" not in (origem.username or "") + (origem.hostname or ""):
              raise SystemExit("BLOQUEADO: origem não corresponde ao projeto operacional CTI.")
          if "xhrikmksydsyalxkkyot" not in (destino.username or "") + (destino.hostname or ""):
              raise SystemExit("BLOQUEADO: destino não corresponde ao projeto espelho autorizado.")
          print("Formato e separação validados sem exposição de credenciais.")
          PY
      - name: Validar leitura da origem
        shell: bash
        run: |
          set -euo pipefail
          psql "$CTI_PRODUCAO_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select current_database(), current_user;" >/dev/null
          psql "$CTI_PRODUCAO_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from information_schema.tables where table_schema='public';" >/dev/null
          pg_dump "$CTI_PRODUCAO_DATABASE_URL" --schema=public --schema-only --no-owner --no-privileges --file=/tmp/cti_schema_verificacao.sql
          test -s /tmp/cti_schema_verificacao.sql
          rm -f /tmp/cti_schema_verificacao.sql
      - name: Validar acesso ao destino sem escrita
        shell: bash
        run: |
          set -euo pipefail
          psql "$CTI_HOMOLOGACAO_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select current_database(), current_user;" >/dev/null
          psql "$CTI_HOMOLOGACAO_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from information_schema.tables where table_schema='public';" >/dev/null
          echo "VERIFICAÇÃO CONCLUÍDA: nenhuma cópia ou alteração foi executada."
