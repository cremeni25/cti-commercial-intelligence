# Validação dedicada da IA Comercial CTI: núcleo agente, integrações e compilação do código em uso.
name: IA Homologacao Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/services/ia_comercial_cti.py"
      - "backend/services/ia_comercial_agente.py"
      - "backend/routers/ia_comercial_cti_router.py"
      - "backend/tests/test_ia_comercial_fontes.py"
      - "backend/tests/test_ia_comercial_agente.py"
      - ".github/workflows/ia-homologacao-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ia-homologacao:
    name: Validar IA Comercial CTI
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-key
      CTI_AMBIENTE: homologation
      CTI_IA_AGENTE_HOMOLOGACAO: "true"
      CTI_IA_AGENTE_SOMENTE_LEITURA: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias Python
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Validar testes isolados da IA
        working-directory: backend
        run: pytest -q tests/test_ia_comercial_fontes.py tests/test_ia_comercial_agente.py tests/test_ia_comercial_contexto_real.py

      - name: Validar compilacao Python
        working-directory: backend
        run: |
          python -m py_compile services/ia_comercial_cti.py
          python -m py_compile services/ia_comercial_agente.py
          python -m py_compile routers/ia_comercial_cti_router.py
