# Execucao consolidada: testes da IA e verificacao somente leitura das conexoes.
# Revisao experimental: normalizacao segura das conexoes para hosts oficiais.
name: IA Homologacao Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/core/ia_agente_homologacao_config.py"
      - "backend/main_ia_homologacao.py"
      - "backend/migrations/homologacao/**"
      - "backend/routers/ia_comercial_agente_homologacao_router.py"
      - "backend/services/ia_comercial_agente_homologacao*.py"
      - "backend/services/ia_homologacao_memoria.py"
      - "backend/tests/test_ia_*homologacao*.py"
      - "backend/tests/test_ia_comercial_fontes.py"
      - "scripts/espelho/**"
      - "render.homologacao.yaml"
      - ".github/workflows/ia-homologacao-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ia-homologacao:
    name: Validar IA e conexoes sem copiar dados
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: cti-ia-homologação
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-key
      CTI_AMBIENTE: homologation
      CTI_IA_AGENTE_HOMOLOGACAO: "true"
      CTI_IA_AGENTE_SOMENTE_LEITURA: "true"
      CTI_PRODUCAO_DATABASE_URL: ${{ secrets.CTI_PRODUCAO_DATABASE_URL }}
      CTI_HOMOLOGACAO_DATABASE_URL: ${{ secrets.CTI_HOMOLOGACAO_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias Python e PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validar testes isolados da IA
        working-directory: backend
        run: |
          pytest -q \
            tests/test_ia_agente_homologacao_config.py \
            tests/test_ia_agente_homologacao_read_only.py \
            tests/test_ia_homologacao_arquitetura.py \
            tests/test_ia_comercial_fontes.py

      - name: Validar compilacao Python
        working-directory: backend
        run: |
          python -m py_compile \
            core/ia_agente_homologacao_config.py \
            main_ia_homologacao.py \
            routers/ia_comercial_agente_homologacao_router.py \
            services/ia_comercial_agente_homologacao.py \
            services/ia_comercial_agente_homologacao_orquestrador.py \
            services/ia_homologacao_memoria.py

      - name: Validar scripts do espelho
        run: |
          bash -n scripts/espelho/exportar_estado_real.sh
          bash -n scripts/espelho/validar_fidelidade.sh
          bash -n scripts/espelho/implantar_espelho_completo.sh

      - name: Normalizar e validar destinos oficiais
        shell: bash
        run: |
          set -euo pipefail
          : "${CTI_PRODUCAO_DATABASE_URL:?Secret CTI_PRODUCAO_DATABASE_URL ausente.}"
          : "${CTI_HOMOLOGACAO_DATABASE_URL:?Secret CTI_HOMOLOGACAO_DATABASE_URL ausente.}"
          python - <<'PY'
          import os
          from urllib.parse import quote

          def credential(raw: str, nome: str) -> str:
              raw = raw.strip()
              if "YOUR-PASSWORD" in raw:
                  raise SystemExit(f"BLOQUEADO: o segredo de {nome} ainda contém YOUR-PASSWORD.")
              if "\n" in raw or "\r" in raw:
                  raise SystemExit(f"BLOQUEADO: o segredo de {nome} deve estar em uma única linha.")
              if raw.startswith(("postgres://", "postgresql://")):
                  after_scheme = raw.split("://", 1)[1]
                  userinfo, sep, _ = after_scheme.rpartition("@")
                  if not sep or ":" not in userinfo:
                      raise SystemExit(f"BLOQUEADO: conexão de {nome} inválida.")
                  _, password = userinfo.split(":", 1)
                  if not password:
                      raise SystemExit(f"BLOQUEADO: credencial de {nome} vazia.")
                  return password
              return quote(raw, safe="")

          prod_password = credential(os.environ["CTI_PRODUCAO_DATABASE_URL"], "produção")
          homo_password = credential(os.environ["CTI_HOMOLOGACAO_DATABASE_URL"], "homologação")

          prod = f"postgresql://postgres:{prod_password}@db.fgjrlyxylhfaeeqijyoe.supabase.co:5432/postgres"
          homo = f"postgresql://postgres:{homo_password}@db.xhrikmksydsyalxkkyot.supabase.co:5432/postgres"

          if prod == homo:
              raise SystemExit("BLOQUEADO: origem e destino são iguais.")

          env_file = os.environ["GITHUB_ENV"]
          with open(env_file, "a", encoding="utf-8") as f:
              f.write(f"CTI_PRODUCAO_DATABASE_URL={prod}\n")
              f.write(f"CTI_HOMOLOGACAO_DATABASE_URL={homo}\n")

          print(f"::add-mask::{prod}")
          print(f"::add-mask::{homo}")
          print("Destinos oficiais normalizados sem exposição de credenciais.")
          PY

      - name: Validar leitura da origem e exportacao temporaria
        shell: bash
        run: |
          set -euo pipefail
          psql "$CTI_PRODUCAO_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select current_database(), current_user;" >/dev/null
          psql "$CTI_PRODUCAO_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from information_schema.tables where table_schema='public';" >/dev/null
          pg_dump "$CTI_PRODUCAO_DATABASE_URL" --schema=public --schema-only --no-owner --no-privileges --file=/tmp/cti_schema_verificacao.sql
          test -s /tmp/cti_schema_verificacao.sql
          rm -f /tmp/cti_schema_verificacao.sql

      - name: Validar acesso ao destino sem escrita
        shell: bash
        run: |
          set -euo pipefail
          psql "$CTI_HOMOLOGACAO_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select current_database(), current_user;" >/dev/null
          psql "$CTI_HOMOLOGACAO_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from information_schema.tables where table_schema='public';" >/dev/null
          echo "VERIFICAÇÃO CONCLUÍDA: nenhuma cópia ou alteração foi executada."

      - name: Limpar arquivo temporario
        if: ${{ always() }}
        run: rm -f /tmp/cti_schema_verificacao.sql
