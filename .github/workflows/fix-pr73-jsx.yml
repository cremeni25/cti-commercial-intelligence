name: Fix PR73 JSX

on:
  push:
    branches:
      - sync-crm-app-site-opportunities

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip-pr73-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-crm-app-site-opportunities
      - name: Corrigir condição JSX e remover automação temporária
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/app/crm-app/[...modulo]/page.tsx')
          text = path.read_text(encoding='utf-8')
          old = '      item.id ? ('
          new = '      Boolean(item.id) ? ('
          if old not in text:
              raise SystemExit('Trecho esperado não encontrado')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-pr73-jsx.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'frontend/src/app/crm-app/[...modulo]/page.tsx' .github/workflows/fix-pr73-jsx.yml
          git commit -m "fix: normalizar condição JSX da oportunidade [skip-pr73-fix]"
          git push origin HEAD:sync-crm-app-site-opportunities
