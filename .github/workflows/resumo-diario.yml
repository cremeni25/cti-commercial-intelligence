# Dispara o resumo diário do Agente de Inteligência no celular da equipe.
# Dias úteis às 07:40 de Brasília (10:40 UTC). Totalmente automático: o backend
# autentica esta execução pelo token de identidade (OIDC) que o próprio GitHub
# emite — nenhum segredo para cadastrar. Envio é idempotente por dia.
name: Resumo diário no celular

on:
  schedule:
    - cron: "40 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CTI_BACKEND_URL: https://cti-backend-5ugf.onrender.com

jobs:
  disparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Disparar resumo diário
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=cti-resumo-diario" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          # O backend pode estar hibernando: acorda antes do disparo.
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors --max-time 60 "$CTI_BACKEND_URL/status" > /dev/null
          curl -fsS --retry 3 --retry-delay 15 --retry-all-errors --max-time 240 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "$CTI_BACKEND_URL/interno/notificacoes/resumo-diario"
