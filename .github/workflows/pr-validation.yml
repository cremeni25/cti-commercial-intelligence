name: PR Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest httpx
      - name: Run backend tests
        run: |
          set +e
          pytest -q > pytest.log 2>&1
          code=$?
          cat pytest.log
          exit $code
      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend/pytest.log

  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: isolated-test-key
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify CRM summary semantics
        working-directory: .
        run: node --experimental-strip-types --test tests/crm/*.test.mjs
      - name: Run frontend lint
        run: |
          set +e
          npm run lint > lint.log 2>&1
          code=$?
          cat lint.log
          exit $code
      - name: Upload frontend lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lint-log
          path: frontend/lint.log
      - name: Run frontend build
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          cat build.log
          exit $code
      - name: Upload frontend build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: frontend/build.log

      - name: Install isolated Feiras verification tools
        working-directory: tests/feiras
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify Feiras database, vault, session and offline flow
        working-directory: tests/feiras
        run: |
          npm run test:database
          npm run test:production-schema
          npm run test:vault
          npm run test:session
          npm run test:ui
          npm run test:offline
          npm run test:crm-home
      - name: Upload Feiras verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feiras-isolated-results
          path: tests/feiras/*-results.json
