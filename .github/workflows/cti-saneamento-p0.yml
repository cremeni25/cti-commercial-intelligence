name: CTI Saneamento P0

on:
  push:
    branches:
      - agent/cti-saneamento-ia-frigorifica-p0

permissions:
  contents: write

jobs:
  saneamento:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar artefatos completos
        run: python scripts/apply_cti_artifacts_full.py
      - name: Instalar dependências de teste
        run: |
          python -m pip install -q pytest openpyxl python-pptx python-docx
      - name: Validar sintaxe Python
        run: python -m compileall -q backend scripts
      - name: Validar saneamento e artefatos
        run: |
          pytest -q backend/tests/test_cti_saneamento_p0.py backend/tests/test_cti_ia_arquivos.py
      - name: Commitar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração adicional."
            exit 0
          fi
          git commit -m "IA: habilitar XLSX PPTX e DOCX auditáveis"
          git push origin HEAD:agent/cti-saneamento-ia-frigorifica-p0
